<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">WaterNet project</title>
  <desc id="description">Reproducible water-quality classification with a cached ensemble, traceable predictions, batch inference, and a hardened Django API.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19232e"/>
      <stop offset="1" stop-color="#121a23"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dda756" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dda756" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dda756" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><g>
    <rect x="0.5" y="0.5" width="1199" height="389" rx="28" fill="url(#panel)" stroke="#b88a4d" stroke-opacity="0.92" stroke-width="1" vector-effect="non-scaling-stroke" shape-rendering="geometricPrecision"/>
  </g>
      <text x="64" y="75" fill="#dda756" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="1.3" text-anchor="start">03 / APPLIED MACHINE LEARNING</text>
      <text x="64" y="133" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="780" letter-spacing="-1.2" text-anchor="start">WaterNet ↗</text>
      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="64" y="176">Reproducible water-quality classification with a cached ensemble,</tspan><tspan x="64" y="205">traceable predictions, batch inference, and a hardened Django API.</tspan></text>
      <rect x="64" y="231" width="79" height="31" rx="9" fill="#1c2632" stroke="#34404d" stroke-width="1"/><text x="103.5" y="251" fill="#dce1e5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="650" letter-spacing="0" text-anchor="middle">Python</text><rect x="152" y="231" width="79" height="31" rx="9" fill="#1c2632" stroke="#34404d" stroke-width="1"/><text x="191.5" y="251" fill="#dce1e5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="650" letter-spacing="0" text-anchor="middle">Django</text><rect x="240" y="231" width="134" height="31" rx="9" fill="#1c2632" stroke="#34404d" stroke-width="1"/><text x="307" y="251" fill="#dce1e5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="650" letter-spacing="0" text-anchor="middle">scikit-learn</text><rect x="383" y="231" width="88" height="31" rx="9" fill="#1c2632" stroke="#34404d" stroke-width="1"/><text x="427" y="251" fill="#dce1e5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="650" letter-spacing="0" text-anchor="middle">XGBoost</text>
      <text x="64" y="317" fill="#aab2bc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="650" letter-spacing="0" text-anchor="start">95%+ accuracy  /  0.96 AUC  /  sub-50 ms inference</text>
