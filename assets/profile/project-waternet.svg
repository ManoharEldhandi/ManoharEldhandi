      <text x="846" y="112" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">MODEL READOUT</text>
      <circle cx="978" cy="195" r="59" fill="none" stroke="#34404d" stroke-width="12"/>
