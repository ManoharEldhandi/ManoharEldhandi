<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title description">
  <title id="title">Contribution activity</title>
  <desc id="description">Contribution activity with a color-changing snake animation below.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19232e"/>
      <stop offset="1" stop-color="#121a23"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dda756" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dda756" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dda756" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="600" y="31" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="750" letter-spacing="2.1" text-anchor="middle">CONTRIBUTIONS</text>
      <text x="600" y="82" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="760" letter-spacing="-1" text-anchor="middle">Consistency leaves a trail.</text>
      <path d="M210 111 H514" stroke="#b88a4d" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <path d="M686 111 H990" stroke="#b88a4d" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g transform="translate(558 103)">
        <rect x="0" y="0" width="12" height="12" rx="3" fill="#5f3745"/>
        <rect x="18" y="0" width="12" height="12" rx="3" fill="#8c4f4f"/>
        <rect x="36" y="0" width="12" height="12" rx="3" fill="#c17649"/>
        <rect x="54" y="0" width="12" height="12" rx="3" fill="#e6b85c"/>
      </g></g>
</svg>
