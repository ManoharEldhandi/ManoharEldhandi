    <circle cx="985" cy="85" r="5" fill="#91aba5"/><circle cx="985" cy="85" r="9" fill="none" stroke="#91aba5" stroke-opacity="0.16"/><text x="1003" y="90" fill="#aab2bc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.7" text-anchor="start">BENGALURU / IST</text>
    <text x="64" y="158" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">AI + SECURITY + BACKEND ENGINEERING</text>
    <text x="64" y="230" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="780" letter-spacing="-2.7" text-anchor="start">Manohar Eldhandi</text>
    <text x="66" y="278" fill="#dda756" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="720" letter-spacing="-0.4" text-anchor="start">Software Engineer</text>
    <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="66" y="331">I build Python agentic-AI security workflows at Cisco,</tspan><tspan x="66" y="360">Java and Spring Boot systems, and full-stack products</tspan><tspan x="66" y="389">with measurable evidence and reliable delivery.</tspan></text>
