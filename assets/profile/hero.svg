<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">Manohar Eldhandi — Software Engineer</title>
  <desc id="description">Software Engineer at Cisco in Bengaluru focused on AI security, backend systems, and product engineering.</desc>
  <defs>
