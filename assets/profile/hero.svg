    <rect x="16" y="16" width="1168" height="488" rx="28" fill="url(#panel)" stroke="#34404d" stroke-width="1.5"/>
    <rect x="26" y="26" width="1148" height="468" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    <path d="M54 17 H1146" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
    <rect x="64" y="62" width="44" height="44" rx="12" fill="#18212b" stroke="#34404d"/>
    <text x="86" y="91" fill="#dda756" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1" text-anchor="middle">ME</text>
    <circle cx="985" cy="85" r="5" fill="#91aba5"/><circle cx="985" cy="85" r="9" fill="none" stroke="#91aba5" stroke-opacity="0.16"/><text x="1003" y="90" fill="#aab2bc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.7" text-anchor="start">BENGALURU / IST</text>
    <text x="64" y="158" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">APPLIED AI + BACKEND ENGINEERING</text>
    <text x="64" y="230" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="780" letter-spacing="-2.7" text-anchor="start">Manohar Eldhandi</text>
    <text x="66" y="278" fill="#dda756" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="720" letter-spacing="-0.4" text-anchor="start">AI &amp; Backend Engineer</text>
    <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="66" y="331">I build dependable backend platforms and applied-AI products with Java and Python—</tspan><tspan x="66" y="362">designed for real users, observable decisions, and production reliability.</tspan></text>
    <g>
    <rect x="820" y="126" width="314" height="230" rx="20" fill="#161f29" stroke="#25303b" stroke-width="1.4"/>
    <path d="M838 127 H1116" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
    <text x="850" y="165" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">CURRENT ROLE</text>
    <text x="850" y="211" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="740" letter-spacing="0" text-anchor="start">Software Engineer</text>
    <text x="850" y="243" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="740" letter-spacing="0" text-anchor="start">at Cisco</text>
    <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="850" y="281">Applying agentic AI and backend</tspan><tspan x="850" y="306">engineering to security-compliance</tspan><tspan x="850" y="331">workflows across product teams.</tspan></text>
    <path d="M64 418 H1136" stroke="#25303b"/>
    <text x="230" y="458" fill="#aab2bc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">BACKEND SYSTEMS</text>
    <path d="M405 432 V470" stroke="#25303b"/>
    <text x="600" y="458" fill="#aab2bc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">APPLIED AI</text>
    <path d="M795 432 V470" stroke="#25303b"/>
    <text x="970" y="458" fill="#aab2bc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">PRODUCT ENGINEERING</text></g>
