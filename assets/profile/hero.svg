    <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="850" y="281">Applying agentic AI and</tspan><tspan x="850" y="305">backend engineering to</tspan><tspan x="850" y="329">security-compliance workflows</tspan><tspan x="850" y="353">across product teams.</tspan></text>
