<svg xmlns="http://www.w3.org/2000/svg" width="600" height="780" viewBox="0 0 600 780" role="img" aria-labelledby="title description">
  <title id="title">Manohar Eldhandi — AI and Backend Engineer</title>
  <desc id="description">Software Engineer at Cisco in Bengaluru focused on applied AI, backend systems, and product engineering.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19232e"/>
      <stop offset="1" stop-color="#121a23"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dda756" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dda756" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dda756" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><g>
    <rect x="0.5" y="0.5" width="599" height="779" rx="28" fill="url(#panel)" stroke="#b88a4d" stroke-opacity="0.92" stroke-width="1" vector-effect="non-scaling-stroke" shape-rendering="geometricPrecision"/>
  </g>
    <rect x="44" y="48" width="44" height="44" rx="12" fill="#18212b" stroke="#34404d"/>
    <text x="66" y="77" fill="#dda756" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1" text-anchor="middle">ME</text>
    <circle cx="418" cy="71" r="5" fill="#91aba5"/><circle cx="418" cy="71" r="9" fill="none" stroke="#91aba5" stroke-opacity="0.16"/><text x="436" y="76" fill="#aab2bc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.7" text-anchor="start">BENGALURU / IST</text>
    <text x="44" y="146" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">APPLIED AI + BACKEND</text>
    <text fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="780" letter-spacing="-2.2" text-anchor="start"><tspan x="44" y="211">Manohar</tspan><tspan x="44" y="271">Eldhandi</tspan></text>
    <text x="46" y="352" fill="#dda756" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="730" letter-spacing="0" text-anchor="start">AI &amp; Backend Engineer</text>
    <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="46" y="401">I build dependable backend platforms and applied-AI</tspan><tspan x="46" y="428">products with Java and Python—designed for real users,</tspan><tspan x="46" y="455">observable decisions, and production reliability.</tspan></text>
    <g>
    <rect x="44" y="505" width="512" height="160" rx="18" fill="#161f29" stroke="#25303b" stroke-width="1.4"/>
    <path d="M62 506 H538" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
    <text x="68" y="540" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">CURRENT ROLE</text>
    <text x="68" y="578" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="740" letter-spacing="0" text-anchor="start">Software Engineer at Cisco</text>
    <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="68" y="614">Agentic AI + backend engineering for security-compliance</tspan><tspan x="68" y="638">workflows used across Cisco product teams.</tspan></text>
    <path d="M44 704 H556" stroke="#25303b"/>
    <text x="300" y="735" fill="#aab2bc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">BACKEND  /  APPLIED AI  /  PRODUCT</text></g>
