<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title description">
  <title id="title">OnTheWay project</title>
  <desc id="description">Route-aware pickup that synchronizes preparation with a customer's live ETA across customer, merchant, and admin workflows.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
