<svg xmlns="http://www.w3.org/2000/svg" width="280" height="82" viewBox="0 0 280 82" role="img" aria-labelledby="title description">
  <title id="title">Portfolio</title>
  <desc id="description">Open Portfolio</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19232e"/>
      <stop offset="1" stop-color="#121a23"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dda756" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dda756" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dda756" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="280" height="82" fill="#0b0f14"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><rect x="4" y="4" width="272" height="74" rx="18" fill="url(#panel)" stroke="#34404d"/>
      <rect x="12" y="12" width="256" height="58" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
      <text x="24" y="36" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="760" letter-spacing="-0.2" text-anchor="start">PORTFOLIO</text>
      <text x="24" y="58" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.1" text-anchor="start">SELECTED WORK</text>
      <text x="252" y="51" fill="#dda756" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="0" text-anchor="middle">↗</text></g>
</svg>
