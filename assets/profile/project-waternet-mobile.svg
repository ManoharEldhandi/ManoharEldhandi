<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title description">
  <title id="title">WaterNet project</title>
  <desc id="description">Reproducible water-quality classification with a cached ensemble, traceable predictions, batch inference, and a hardened Django API.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19232e"/>
      <stop offset="1" stop-color="#121a23"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dda756" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dda756" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dda756" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><g>
    <rect x="0.5" y="0.5" width="599" height="599" rx="28" fill="url(#panel)" stroke="#b88a4d" stroke-opacity="0.92" stroke-width="1" vector-effect="non-scaling-stroke" shape-rendering="geometricPrecision"/>
  </g>
        <text x="44" y="67" fill="#dda756" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="1.2" text-anchor="start">03 / APPLIED MACHINE LEARNING</text>
        <text x="44" y="119" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="780" letter-spacing="-1" text-anchor="start">WaterNet ↗</text>
        <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="44" y="160">Reproducible water-quality classification with</tspan><tspan x="44" y="187">a cached ensemble, traceable predictions, batch</tspan><tspan x="44" y="214">inference, and a hardened Django API.</tspan></text>
        <rect x="44" y="235" width="79" height="31" rx="9" fill="#1c2632" stroke="#34404d" stroke-width="1"/><text x="83.5" y="255" fill="#dce1e5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="650" letter-spacing="0" text-anchor="middle">Python</text><rect x="132" y="235" width="79" height="31" rx="9" fill="#1c2632" stroke="#34404d" stroke-width="1"/><text x="171.5" y="255" fill="#dce1e5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="650" letter-spacing="0" text-anchor="middle">Django</text><rect x="220" y="235" width="134" height="31" rx="9" fill="#1c2632" stroke="#34404d" stroke-width="1"/><text x="287" y="255" fill="#dce1e5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="650" letter-spacing="0" text-anchor="middle">scikit-learn</text><rect x="363" y="235" width="88" height="31" rx="9" fill="#1c2632" stroke="#34404d" stroke-width="1"/><text x="407" y="255" fill="#dce1e5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="650" letter-spacing="0" text-anchor="middle">XGBoost</text>
        <text x="44" y="337" fill="#aab2bc" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="650" letter-spacing="0" text-anchor="start">95%+ accuracy  /  0.96 AUC  /  sub-50 ms inference</text>
        <g>
    <rect x="44" y="374" width="512" height="172" rx="20" fill="#161f29" stroke="#25303b" stroke-width="1.4"/>
    <path d="M62 375 H538" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
      <text x="70" y="416" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">MODEL READOUT</text>
      <circle cx="300" cy="499" r="59" fill="none" stroke="#34404d" stroke-width="12"/>
      <circle cx="300" cy="499" r="59" fill="none" stroke="#dda756" stroke-width="12" stroke-linecap="round" stroke-dasharray="356 371" transform="rotate(-90 300 499)"/>
      <text x="300" y="496" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="780" letter-spacing="0" text-anchor="middle">0.96</text>
      <text x="300" y="521" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="750" letter-spacing="1" text-anchor="middle">AUC</text></g>
