      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="62" y="896">A grounded, code-aware</tspan><tspan x="62" y="918">11-stage AI pipeline.</tspan></text><g>
