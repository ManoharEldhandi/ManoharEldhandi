      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="68" y="493">At Cisco, I apply AI and backend</tspan><tspan x="68" y="520">engineering to security-compliance</tspan><tspan x="68" y="547">workflows across product teams.</tspan></text>
