      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="62" y="718">Adopted across four Cisco</tspan><tspan x="62" y="740">product teams.</tspan></text><g>
