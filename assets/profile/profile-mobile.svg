    <path d="M62 251 H538" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
      <text x="68" y="290" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="740" letter-spacing="0" text-anchor="start">What I build</text>
      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="68" y="327">Reliable APIs, event-driven services,</tspan><tspan x="68" y="354">agent tooling, and deterministic-first</tspan><tspan x="68" y="381">LLM pipelines.</tspan></text>
      <g>
