  </g>
      <text x="44" y="70" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">ENGINEERING PROFILE</text>
      <text fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="760" letter-spacing="-0.7" text-anchor="start"><tspan x="44" y="116">Build the foundation.</tspan><tspan x="44" y="154">Apply intelligence where</tspan><tspan x="44" y="192">it earns its place.</tspan></text>
