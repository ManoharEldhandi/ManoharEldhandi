<svg xmlns="http://www.w3.org/2000/svg" width="600" height="980" viewBox="0 0 600 980" role="img" aria-labelledby="title description">
  <title id="title">Engineering profile and selected impact</title>
  <desc id="description">Backend and applied-AI engineering profile with measurable outcomes at Cisco.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19232e"/>
      <stop offset="1" stop-color="#121a23"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dda756" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dda756" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dda756" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="600" height="980" fill="#0b0f14"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><g filter="url(#shadow)">
    <rect x="16" y="16" width="568" height="948" rx="28" fill="url(#panel)" stroke="#34404d" stroke-width="1.5"/>
    <rect x="26" y="26" width="548" height="928" rx="19" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    <path d="M54 17 H546" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
      <text x="44" y="70" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">ENGINEERING PROFILE</text>
      <text fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="760" letter-spacing="-0.7" text-anchor="start"><tspan x="44" y="116">Build the foundation.</tspan><tspan x="44" y="154">Apply intelligence where</tspan><tspan x="44" y="192">it earns its place.</tspan></text>
      <g>
    <rect x="44" y="250" width="512" height="145" rx="18" fill="#121a23" stroke="#25303b" stroke-width="1.4"/>
    <path d="M62 251 H538" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
      <text x="68" y="290" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="740" letter-spacing="0" text-anchor="start">What I build</text>
      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="68" y="327">Reliable APIs, event-driven services, agent tooling,</tspan><tspan x="68" y="353">and deterministic-first LLM pipelines.</tspan></text>
      <g>
    <rect x="44" y="415" width="512" height="155" rx="18" fill="#161f29" stroke="#25303b" stroke-width="1.4"/>
    <path d="M62 416 H538" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
      <text x="68" y="456" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="740" letter-spacing="0" text-anchor="start">Current focus</text>
      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="68" y="493">At Cisco, I apply AI and backend engineering to</tspan><tspan x="68" y="519">security-compliance automation across product teams.</tspan></text>
      <g>
    <rect x="44" y="610" width="240" height="158" rx="16" fill="#161f29" stroke="#25303b" stroke-width="1.4"/>
    <path d="M62 611 H266" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
      <text x="62" y="653" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="780" letter-spacing="0" text-anchor="start">50+</text>
      <text x="62" y="680" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="750" letter-spacing="0.8" text-anchor="start">ENGINEERS</text>
      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="62" y="718">Adopted across four Cisco</tspan><tspan x="62" y="738">product teams.</tspan></text><g>
    <rect x="300" y="610" width="240" height="158" rx="16" fill="#121a23" stroke="#25303b" stroke-width="1.4"/>
    <path d="M318 611 H522" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
      <text x="318" y="653" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="780" letter-spacing="0" text-anchor="start">70%</text>
      <text x="318" y="680" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="750" letter-spacing="0.8" text-anchor="start">LESS REVIEW</text>
      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="318" y="718">Traceable automation reduced</tspan><tspan x="318" y="738">manual effort.</tspan></text><g>
    <rect x="44" y="788" width="240" height="158" rx="16" fill="#121a23" stroke="#25303b" stroke-width="1.4"/>
    <path d="M62 789 H266" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
      <text x="62" y="831" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="780" letter-spacing="0" text-anchor="start">10×</text>
      <text x="62" y="858" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="750" letter-spacing="0.8" text-anchor="start">FEWER CALLS</text>
      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="62" y="896">A deterministic-first</tspan><tspan x="62" y="916">11-phase AI pipeline.</tspan></text><g>
    <rect x="300" y="788" width="240" height="158" rx="16" fill="#161f29" stroke="#25303b" stroke-width="1.4"/>
    <path d="M318 789 H522" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
      <text x="318" y="831" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="780" letter-spacing="0" text-anchor="start">736</text>
      <text x="318" y="858" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="750" letter-spacing="0.8" text-anchor="start">TESTS / 96% UI</text>
      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="318" y="896">Automation strengthened</tspan><tspan x="318" y="916">release confidence.</tspan></text></g>
