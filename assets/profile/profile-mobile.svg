      <text x="318" y="680" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="750" letter-spacing="0.8" text-anchor="start">LESS REVIEW</text>
      <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="318" y="718">Traceable automation reduced</tspan><tspan x="318" y="740">manual effort.</tspan></text><g>
