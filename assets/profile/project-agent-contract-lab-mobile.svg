<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" role="img" aria-labelledby="title description">
  <title id="title">Agent Contract Lab project</title>
  <desc id="description">Local observability and contract tests for coding agents, with redacted timelines, deterministic checks, and verified bundles.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
