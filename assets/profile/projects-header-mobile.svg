<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-labelledby="title description">
  <title id="title">Selected projects</title>
  <desc id="description">Three selected projects showing backend, applied AI, and machine-learning engineering.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19232e"/>
      <stop offset="1" stop-color="#121a23"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dda756" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dda756" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dda756" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="600" height="230" fill="#0b0f14"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><g filter="url(#shadow)">
    <rect x="16" y="16" width="568" height="198" rx="24" fill="url(#panel)" stroke="#34404d" stroke-width="1.5"/>
    <rect x="26" y="26" width="548" height="178" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    <path d="M54 17 H546" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
      <text x="44" y="70" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">SELECTED BUILDS</text>
      <text fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="760" letter-spacing="0" text-anchor="start"><tspan x="44" y="116">Three systems.</tspan><tspan x="44" y="154">Three different engineering problems.</tspan></text>
    </g>
</svg>
