        <text x="896" y="445" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="750" letter-spacing="1" text-anchor="start">FEWER MODEL CALLS</text>
        <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="896" y="484">With source evidence</tspan><tspan x="896" y="508">kept traceable.</tspan></text></g>
