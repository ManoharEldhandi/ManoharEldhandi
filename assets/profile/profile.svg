<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description">
  <title id="title">Engineering profile and selected impact</title>
  <desc id="description">Agentic AI for security-compliance review automation at Cisco, October 2025 to October 2026. Prompt engineering, RAG architecture, and MCP integrations. Review time reduced from 80 to 16 hours per cycle for 50+ engineers across four product teams.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19232e"/>
      <stop offset="1" stop-color="#121a23"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dda756" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dda756" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dda756" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><g>
    <rect x="0.5" y="0.5" width="1199" height="619" rx="28" fill="url(#panel)" stroke="#b88a4d" stroke-opacity="0.92" stroke-width="1" vector-effect="non-scaling-stroke" shape-rendering="geometricPrecision"/>
  </g>
        <text x="64" y="78" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">ENGINEERING PROFILE</text>
        <text x="64" y="126" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="760" letter-spacing="-1.1" text-anchor="start">Security-compliance review automation.</text>
        <g>
    <rect x="64" y="166" width="520" height="160" rx="18" fill="#121a23" stroke="#25303b" stroke-width="1.4"/>
    <path d="M82 167 H566" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
        <text x="90" y="207" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="740" letter-spacing="0" text-anchor="start">The work</text>
        <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="90" y="245">LangGraph, LangChain, and two LLM providers.</tspan><tspan x="90" y="272">MCP tools for Jira and security data.</tspan><tspan x="90" y="299">Prompt engineering and structured outputs.</tspan></text>
        <g>
    <rect x="602" y="166" width="534" height="160" rx="18" fill="#161f29" stroke="#25303b" stroke-width="1.4"/>
    <path d="M620 167 H1118" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
        <text x="628" y="207" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="740" letter-spacing="0" text-anchor="start">RAG and testing</text>
        <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="628" y="245">RAG architecture with traceable source evidence.</tspan><tspan x="628" y="272">Code reviews and automated UI checks.</tspan><tspan x="628" y="299">97% Playwright UI coverage.</tspan></text>
        <g>
    <rect x="64" y="366" width="252" height="180" rx="17" fill="#161f29" stroke="#25303b" stroke-width="1.4"/>
    <path d="M82 367 H298" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
        <text x="86" y="414" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="780" letter-spacing="-1" text-anchor="start">50+</text>
        <text x="86" y="445" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="750" letter-spacing="1" text-anchor="start">ENGINEERS</text>
        <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="86" y="484">Across four Cisco</tspan><tspan x="86" y="508">product teams.</tspan></text><g>
    <rect x="334" y="366" width="252" height="180" rx="17" fill="#121a23" stroke="#25303b" stroke-width="1.4"/>
