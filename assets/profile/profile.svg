  </g>
        <text x="356" y="414" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="780" letter-spacing="-1" text-anchor="start">80%</text>
        <text x="356" y="445" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="750" letter-spacing="1" text-anchor="start">LESS REVIEW TIME</text>
        <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="356" y="484">80 to 16 hours</tspan><tspan x="356" y="508">per review cycle.</tspan></text><g>
    <rect x="604" y="366" width="252" height="180" rx="17" fill="#121a23" stroke="#25303b" stroke-width="1.4"/>
    <path d="M622 367 H838" stroke="#ffffff" stroke-opacity="0.055"/>
  </g>
        <text x="626" y="414" fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="780" letter-spacing="-1" text-anchor="start">20K+</text>
        <text x="626" y="445" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="750" letter-spacing="1" text-anchor="start">SOURCE FILES</text>
        <text fill="#aab2bc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="450" letter-spacing="0" text-anchor="start"><tspan x="626" y="484">An 11-stage RAG and</tspan><tspan x="626" y="508">code-graph pipeline.</tspan></text><g>
    <rect x="874" y="366" width="252" height="180" rx="17" fill="#161f29" stroke="#25303b" stroke-width="1.4"/>
