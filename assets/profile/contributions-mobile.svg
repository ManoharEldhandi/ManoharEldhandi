<svg xmlns="http://www.w3.org/2000/svg" width="600" height="170" viewBox="0 0 600 170" role="img" aria-labelledby="title description">
  <title id="title">Contribution activity</title>
  <desc id="description">Contribution activity with a color-changing snake animation below.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19232e"/>
      <stop offset="1" stop-color="#121a23"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dda756" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dda756" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dda756" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><text x="300" y="30" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="750" letter-spacing="2.1" text-anchor="middle">CONTRIBUTIONS</text>
      <text fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="760" letter-spacing="0" text-anchor="middle"><tspan x="300" y="74">Consistency</tspan><tspan x="300" y="109">leaves a trail.</tspan></text>
      <path d="M104 143 H250" stroke="#b88a4d" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <path d="M350 143 H496" stroke="#b88a4d" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <g transform="translate(268 135)">
        <rect x="0" y="0" width="12" height="12" rx="3" fill="#5f3745"/>
        <rect x="18" y="0" width="12" height="12" rx="3" fill="#8c4f4f"/>
        <rect x="36" y="0" width="12" height="12" rx="3" fill="#c17649"/>
        <rect x="54" y="0" width="12" height="12" rx="3" fill="#e6b85c"/>
      </g></g>
</svg>
