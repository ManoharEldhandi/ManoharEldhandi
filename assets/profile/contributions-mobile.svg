<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="title description">
  <title id="title">Contribution activity</title>
  <desc id="description">Contribution activity with a color-changing snake animation below.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#0e141b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19232e"/>
      <stop offset="1" stop-color="#121a23"/>
    </linearGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dda756" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dda756" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dda756" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>
  <rect width="600" height="250" fill="#0b0f14"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><g filter="url(#shadow)">
    <rect x="16" y="16" width="568" height="218" rx="24" fill="url(#panel)" stroke="#34404d" stroke-width="1.5"/>
    <rect x="26" y="26" width="548" height="198" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    <path d="M54 17 H546" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
      <text x="44" y="70" fill="#91aba5" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="750" letter-spacing="2.4" text-anchor="start">CONTRIBUTIONS</text>
      <text fill="#f3efe7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="31" font-weight="760" letter-spacing="0" text-anchor="start"><tspan x="44" y="116">Consistency</tspan><tspan x="44" y="154">leaves a trail.</tspan></text>
      <g transform="translate(410 176)">
        <rect x="0" y="0" width="16" height="16" rx="4" fill="#5f3745"/>
        <rect x="24" y="0" width="16" height="16" rx="4" fill="#8c4f4f"/>
        <rect x="48" y="0" width="16" height="16" rx="4" fill="#c17649"/>
        <rect x="72" y="0" width="16" height="16" rx="4" fill="#e6b85c"/>
      </g></g>
</svg>
